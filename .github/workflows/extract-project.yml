name: Fix V0 Project Structure

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix project structure
        run: |
          set -e

          echo "Current files:"
          find . -maxdepth 2 -type f | sort

          mkdir -p app

          if [ -f "page.tsx" ]; then
            mv page.tsx app/page.tsx
          fi

          if [ -f "layout.tsx" ]; then
            mv layout.tsx app/layout.tsx
          fi

          if [ -f "globals.css" ]; then
            mv globals.css app/globals.css
          fi

          if [ -d "api" ]; then
            mv api app/api
          fi

          echo "Final structure:"
          find app -maxdepth 3 -type f | sort

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix Next.js app structure"
            git push
          fi